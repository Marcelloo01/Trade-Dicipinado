<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Disciplinado </title> 
  <!-- Configurações para abrir em Tela Cheia no Celular (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TraderQuest">
  <meta name="theme-color" content="#111827">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para os gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 max-w-md mx-auto pb-12">

  <!-- Cabeçalho & Desafio 30 Dias -->
  <header class="bg-gray-800 p-4 rounded-xl mb-6 shadow-lg border border-gray-700 text-center">
    <h1 class="text-xl font-bold text-yellow-400">🛡️ Trader Disciplinado </h1>
    <p class="text-xs text-gray-400 mt-1">Meta: 30 Dias Sem Errar o Plano</p>
    
    <div class="mt-4">
      <div class="flex justify-between text-sm mb-1 font-semibold">
        <span>Progresso:</span>
        <span id="streak-count" class="text-yellow-400">0 / 30 Dias</span>
      </div>
      <div class="w-full bg-gray-700 h-4 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-yellow-400 h-full w-0 transition-all duration-500"></div>
      </div>
    </div>
  </header>

  <!-- Missões Diárias -->
  <section class="bg-gray-800 p-4 rounded-xl mb-6 shadow-lg border border-gray-700">
    <h2 class="text-md font-bold mb-3 text-green-400 border-b border-gray-700 pb-2">🎯 Missões de Hoje</h2>
    <div id="missions-list" class="space-y-3"></div>
  </section>

  <!-- Diário Financeiro & Disciplina -->
  <section class="bg-gray-800 p-4 rounded-xl mb-6 shadow-lg border border-gray-700">
    <h2 class="text-md font-bold mb-3 text-blue-400 border-b border-gray-700 pb-2">📈 Registrar Dia</h2>
    <form id="pnl-form" class="space-y-3">
      <div>
        <label class="block text-xs text-gray-400 mb-1">Resultado Financeiro (R$)</label>
        <input type="number" step="any" id="pnl-input" placeholder="Ex: 150 ou -80" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-blue-500" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2 rounded text-sm transition">Finalizar e Salvar Dia</button>
    </form>
  </section>

  <!-- Dashboard de Gráficos -->
  <section class="bg-gray-800 p-4 rounded-xl mb-6 shadow-lg border border-gray-700 space-y-6">
    <h2 class="text-md font-bold text-purple-400 border-b border-gray-700 pb-2">📊 Desempenho & Estatísticas</h2>
    
    <!-- Gráfico 1: Disciplina -->
    <div>
      <h3 class="text-xs font-semibold text-gray-300 mb-2 text-center">Disciplinado vs Indisciplinado</h3>
      <div class="w-48 mx-auto">
        <canvas id="disciplineChart"></canvas>
      </div>
    </div>

    <!-- Gráfico 2: Evolução Financeira -->
    <div>
      <h3 class="text-xs font-semibold text-gray-300 mb-2 text-center">Evolução Financeira (R$)</h3>
      <canvas id="pnlChart"></canvas>
    </div>
  </section>

  <!-- Histórico Registrado -->
  <section class="bg-gray-800 p-4 rounded-xl mb-6 shadow-lg border border-gray-700">
    <h2 class="text-md font-bold mb-3 text-yellow-400 border-b border-gray-700 pb-2">📜 Histórico de Dias</h2>
    <div id="history-list" class="space-y-2 text-xs max-h-48 overflow-y-auto">
      <p class="text-gray-500 italic text-center">Nenhum registro ainda.</p>
    </div>
  </section>

  <script src="./script.js"></script>
</body>
</html>
